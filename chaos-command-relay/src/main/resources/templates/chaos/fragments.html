<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${title}">Chaos Relay Console</title>
  <link rel="stylesheet" th:href="@{/css/chaos-console.css}"/>
</head>
<body>
<header th:fragment="header(currentNav)" class="site-header">
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div class="site-header-inner">
    <div class="site-brand">
      <h1>Chaos Command Relay</h1>
      <p class="site-tagline">Apply chaos scenarios to registered services and track command outcomes</p>
    </div>
    <nav class="site-nav" aria-label="Console navigation">
      <a th:href="@{/chaos}"
         th:classappend="${currentNav == 'dashboard'} ? ' nav-link-active' : ''">Dashboard</a>
      <a th:href="@{/chaos/commands/new}"
         th:classappend="${currentNav == 'publish'} ? ' nav-link-active' : ''">Publish command</a>
      <form th:if="${!#lists.isEmpty(targetApplications)}"
            th:action="@{/chaos/reset-all-configuration}"
            method="post"
            class="inline-form"
            onsubmit="return confirm('Disable Chaos Monkey on every registered target? Demo order data is not cleared.');">
        <input type="hidden" name="issuedBy" value="chaos-console"/>
        <button type="submit" class="btn btn-danger" style="width: auto" aria-label="Reset Chaos Monkey on all targets">
          <span th:replace="~{chaos/fragments-table :: icon-rotate}"></span>
          Reset all CM
        </button>
      </form>
      <a th:href="${verifyUiUrl}" target="_blank" rel="noopener noreferrer">Verify UI</a>
    </nav>
  </div>
</header>

<nav th:fragment="serviceTabs(applicationName, activeTab, commandCount)"
     class="console-tabs"
     role="tablist"
     aria-label="Service sections">
  <a class="console-tab"
     role="tab"
     th:href="@{/chaos/services/{app}(app=${applicationName}, tab='overview')}"
     th:classappend="${activeTab == 'overview'} ? ' console-tab-active' : ''"
     th:attr="aria-selected=${activeTab == 'overview'}">
    <span class="console-tab-label">Overview</span>
    <span class="console-tab-desc">Relay summary</span>
  </a>
  <a class="console-tab"
     role="tab"
     th:href="@{/chaos/services/{app}(app=${applicationName}, tab='actuator')}"
     th:classappend="${activeTab == 'actuator'} ? ' console-tab-active' : ''"
     th:attr="aria-selected=${activeTab == 'actuator'}">
    <span class="console-tab-label">Live actuator</span>
    <span class="console-tab-desc">Chaos Monkey on pod</span>
  </a>
  <a class="console-tab"
     role="tab"
     th:href="@{/chaos/services/{app}(app=${applicationName}, tab='commands')}"
     th:classappend="${activeTab == 'commands'} ? ' console-tab-active' : ''"
     th:attr="aria-selected=${activeTab == 'commands'}">
    <span class="console-tab-label">Command history</span>
    <span class="console-tab-desc">
      Published commands
      <span th:if="${commandCount > 0}"
            class="console-tab-badge"
            th:text="${commandCount}">0</span>
    </span>
  </a>
  <a class="console-tab"
     role="tab"
     th:href="@{/chaos/services/{app}(app=${applicationName}, tab='maintenance')}"
     th:classappend="${activeTab == 'maintenance'} ? ' console-tab-active' : ''"
     th:attr="aria-selected=${activeTab == 'maintenance'}">
    <span class="console-tab-label">Maintenance</span>
    <span class="console-tab-desc">Reset, enable, assault JSON</span>
  </a>
</nav>
</body>
</html>
