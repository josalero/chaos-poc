server:
  port: 8090
  tomcat:
    use-relative-redirects: true

spring:
  application:
    name: chaos-command-relay
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 10s
  security:
    oauth2:
      client:
        registration:
          chaos-command-relay:
            provider: chaos-auth
            client-id: chaos-command-relay
            client-secret: ${CHAOS_RELAY_CLIENT_SECRET:local-poc-only}
            authorization-grant-type: client_credentials
            scope: chaos.command
        provider:
          chaos-auth:
            token-uri: ${CHAOS_AUTH_URL:http://localhost:9000}/oauth2/token

chaos:
  relay:
    allowed-target-applications:
      - chaos-poc-demo
      - chaos-poc-downstream
    status-timeout-seconds: 30
    command-ttl-hours: 24
    verify-ui-url: http://localhost:18000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
