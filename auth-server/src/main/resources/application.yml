server:
  port: 9000

spring:
  application:
    name: chaos-auth-server
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      authorizationserver:
        # Must equal the resource servers' issuer-uri; tokens carry it as the "iss" claim.
        issuer: ${CHAOS_AUTH_ISSUER:http://localhost:9000}
        client:
          chaos-command-relay:
            registration:
              client-id: chaos-command-relay
              # POC-only default; set CHAOS_RELAY_CLIENT_SECRET outside local runs.
              client-secret: "{noop}${CHAOS_RELAY_CLIENT_SECRET:local-poc-only}"
              client-authentication-methods:
                - client_secret_basic
              authorization-grant-types:
                - client_credentials
              scopes:
                - chaos.command
            token:
              access-token-time-to-live: 5m

management:
  endpoints:
    web:
      exposure:
        include: health
