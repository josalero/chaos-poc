server:
  port: 8081

spring:
  application:
    name: chaos-poc-downstream
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${CHAOS_AUTH_ISSUER:http://localhost:9000}
          jwk-set-uri: ${CHAOS_AUTH_URL:http://localhost:9000}/oauth2/jwks

samba:
  chaos:
    command:
      enabled: true
      pod-name: ${spring.application.name}
