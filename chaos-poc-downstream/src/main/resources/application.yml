server:
  port: 8081

spring:
  application:
    name: chaos-poc-downstream
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  profiles:
    active: local,chaos-monkey
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${CHAOS_AUTH_ISSUER:http://localhost:9000}
          jwk-set-uri: ${CHAOS_AUTH_URL:http://localhost:9000}/oauth2/jwks

samba:
  chaos:
    command:
      enabled: true
      pod-name: ${HOSTNAME:chaos-poc-downstream}
      actuator-base-url: http://127.0.0.1:8081/actuator/chaosmonkey

chaos:
  monkey:
    enabled: false
    watcher:
      service: true
      restController: false
    assaults:
      level: 1

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,chaosmonkey
  endpoint:
    chaosmonkey:
      access: unrestricted
